[package]
name = "tally"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
rand = "0.10.3"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.27.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
unwrap_used = "warn"
