[package]
name = "tally"
version = "0.0.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
unwrap_used = "warn"
