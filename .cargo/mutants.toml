# main.rs only wires things together; it's not worth mutating
exclude_globs = ["src/main.rs"]

exclude_re = [
    # StatusCode::default() is 200 OK, so this mutant behaves the same as the real code
    "health\\.rs.*replace check -> StatusCode with Default",
    # Tests use sessions 30 minutes and 2 hours old, never exactly 1 hour, so >= behaves the same as >
    "auth\\.rs.*replace > with >= in require_token",
]
